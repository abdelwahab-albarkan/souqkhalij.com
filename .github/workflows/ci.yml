name: CI & Technical SEO Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Production Site (3,057 pages)
      run: node build.mjs

    - name: Run Technical SEO Audit (57 Health Checks)
      run: npm test

