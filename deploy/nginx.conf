server {
    listen 80;
    listen [::]:80;
    server_name souqkhalij.com www.souqkhalij.com;
    return 301 https://souqkhalij.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.souqkhalij.com;
    
    # SSL Configuration (Let's Encrypt / Cloudflare Origin)
    ssl_certificate /etc/letsencrypt/live/souqkhalij.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/souqkhalij.com/privkey.pem;
    
    return 301 https://souqkhalij.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name souqkhalij.com;

    root /var/www/khalij-iptv/dist;
    index index.html;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/souqkhalij.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/souqkhalij.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Immutable Cache for Assets & Images (1 Year)
    location ~* \.(?:css|js|webp|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Legacy Dropped Domain / Old Shopify 301 Redirects
    location ~* ^/pages/contact {
        return 301 /iptv-contact/;
    }
    location ~* ^/contact {
        return 301 /iptv-contact/;
    }
    location ~* ^/collections/ {
        return 301 /iptv-prices/;
    }
    location ~* ^/products/ {
        return 301 /iptv-prices/;
    }
    location ~* ^/pages/ {
        return 301 /;
    }

    # Clean URL Routing
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # 404 Error Page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Block Hidden Files & Dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

